FAST_HEAT_POWER_NOT_APPLIED=Der Heizstab konnte die angeforderte Leistung nicht übernehmen. In der Regel ist dies der Fall, sobald eine hinterlegte Zieltemperatur erreicht wurde oder interne Funktionen wie der Legionellenschutz aktiv sind.
BOOST_ACTIVE=Die Steuerung des Heizstabs wird vom Boost-Modus überschrieben. Bitte deaktiviere den Boost-Modus in der my-PV App.