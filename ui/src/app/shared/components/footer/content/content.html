@if (user && edge && displayValues) {
  <ng-container lines="none">
    <ion-grid part="footer-content" style="background-color: var(--ion-color-toolbar-primary); color: var(--ion-color-primary-footer)" class="ion-padding-bottom">
      <ion-row class="ion-padding-bottom">
        <ion-col size="12" style="text-align: center;">
          @if (displayValues.comment) {
            <span>{{displayValues.comment}} |</span>
          }
          <span>
            {{displayValues.id}}
          </span>
          |
          @if ((service.metadata | async)?.user?.globalRole; as role) {
            <a part="footer-link" routerLink="/device/{{edge.id}}/settings/system" style="color: var(--ion-color-primary-footer)">
              Version {{(displayValues.version | version:role)}}
            </a>
          }
        </ion-col>
      </ion-row>
    </ion-grid>
  </ng-container>
}
