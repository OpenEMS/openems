<svg width="100%" height="24" overflow="visible">
  <rect width="100%" rx="7.3" ry="7.3" height="22" style="fill: var(--ion-background-percentagebar-color)" />
  @if (percentageValue() != null) {
    <rect x="2" y="2" rx="6" ry="6" height="18" style="fill: var(--ion-color-active-percentagebar)" [style]="'width: calc(' + percentageValue() + '% - 4px); transition: width 0.5s ease-in-out;'" />

    <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" style="font-weight: 500; text-shadow: var(--ion-text-shadow)" [ngClass]="(percentageValue() ?? 0) > 55 ? 'percentage-style-dark' : 'percentage-style'">
      {{ percentageValue() | unitvalue: "%" }}
    </text>
  }
  <ng-content></ng-content>
</svg>
