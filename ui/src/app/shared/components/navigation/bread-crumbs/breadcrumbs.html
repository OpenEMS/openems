@if (breadCrumbs().length > 0) {
  <ion-breadcrumbs [maxItems]="maxItems">
    @for(parent of breadCrumbs().slice(1); track parent.routerLink.baseString; let isLast
    = $last; let isFirst = $first; let index = $index){
      <ion-breadcrumb [active]="isLast" (keydown.enter)="handleNavigate($event, parent, isLast)"
        (click)="handleNavigate($event, parent, isLast)" tabindex="0" color="primary">
        @if (parent.mode === 'icon') {
          <ion-icon style="cursor: pointer" [name]="parent.icon.name"
            [color]="currentlyActive ? 'primary': 'medium'"></ion-icon>
        }

        @if (!isFirst) {
          <ion-text style="cursor: pointer" [color]="isLast ? 'primary': 'medium'">&nbsp;{{parent.label}}</ion-text>
        }
      </ion-breadcrumb>
    }
  </ion-breadcrumbs>
}
