@if (isVisible) {
  <ion-modal class="action-sheet-modal" #modal [isOpen]="true" [initialBreakpoint]="initialBreakPoint"
    [breakpoints]="[initialBreakPoint,upperMostBreakPoint]" showBackdrop="true" [backdropDismiss]="false"
    [backdropBreakpoint]="initialBreakPoint" focusTrap="false" style="--box-shadow: 0 0 0.25rem rgba(0,0,0,0.7)"
    (ionBreakpointDidChange)="onBreakpointDidChange($event)" [animated]="true">
    <ng-template>
      <ion-content class="ion-padding">
        <oe-navigation-breadcrumbs (navigate)="navigateTo($event, true)"></oe-navigation-breadcrumbs>
        <ion-grid [style.overflow-y]="childrenPerRow.length === 1 ? 'inherit': 'scroll'">
          @for (children of childrenPerRow; track children){
            <ion-row [style.white-space]="childrenPerRow.length === 1 ? 'inherit': 'nowrap'">
              <oe-navigation-chips [children]="children" (navigate)="navigateTo($event, true)"></oe-navigation-chips>
            </ion-row>
          }
        </ion-grid>
        <oe-footer-content style="display: block; height: 20vh; padding-top: 10%;"></oe-footer-content>
      </ion-content>
    </ng-template>
  </ion-modal>
}
