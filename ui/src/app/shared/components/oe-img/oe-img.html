@if (inlineSvg) {
  <div class="svg-container" [innerHTML]="inlineSvg" [style.width.%]="img?.width ?? null" [style.height.%]="img?.height ?? null" [style.color]="img?.color ?? null" [style]="img?.style"></div>
} @else {
  <ion-img [src]="renderedUrl" [style.width.%]="img?.width ?? null" [style.height.%]="img?.height ?? null" [style.object-fit]="'contain'" [style]="img?.style" (ionError)="onImgError()"></ion-img>
}
