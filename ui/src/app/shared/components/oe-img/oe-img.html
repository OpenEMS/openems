@if (inlineSvg(); as svg) {
  <div class="svg-container" [innerHTML]="svg" [style.width.%]="img?.width ?? null" [style.height.%]="img?.height ?? null" [style.color]="img?.color ?? null" [style]="img?.style"></div>
} @else if (renderedUrl(); as src) {
  <ion-img [src]="src" [style.width.%]="img?.width ?? null" [style.height.%]="img?.height ?? null" [style.object-fit]="'contain'" [style]="img?.style" (ionError)="onImgError()"></ion-img>
}
