@if (info || html) {
  <ion-row size="12" class="full_width ion-align-items-center" [class]="customClass() ?? ''">
    @if (icon) {
      <ion-col [size]="icon ? 1 : 0">
        <ion-icon [color]="icon?.color ?? 'primary'" [name]="icon?.name ?? 'information-outline'" [size]="icon?.size ?? 'small'"> </ion-icon>
      </ion-col>
    }
    <ion-col [size]="!icon ? 12 : 11">
      @if (html !== null && html !== undefined) {
        <div [innerHtml]="html"></div>
      } @else if ((info | typeof) !== "string") {
        @for (line of info; track line) {
          <div [style]="line.lineStyle">
            {{ line.text }}
            @if (info.length > 1) {
              <br />
            }
          </div>
        }
      } @else {
        <div>
          {{ info }}
        </div>
      }
    </ion-col>
  </ion-row>
}
