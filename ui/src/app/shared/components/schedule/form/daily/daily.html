@if (spinnerId != null) {
  @for (timeField of timeFields; track timeField.key) {
    <ion-item>
      <ion-label>
        {{ timeField.label }}
      </ion-label>

      <ion-datetime-button slot="end" [datetime]="spinnerId + timeField.id" color="medium" class="datetime-button" displayFormat="HH:mm">
        <span slot="time-target" [style.opacity]="timeField.signal() === null ? 'var(--ion-placeholder-opacity)' : 'inherit'">
          {{ timeField.signal() === null ? ("JS_SCHEDULE.PLEASE_CHOOSE" | translate) : (timeField.signal() | date: "HH:mm") }}
        </span>
      </ion-datetime-button>

      <ion-modal [keepContentsMounted]="true">
        <ng-template>
          <ion-datetime #timePicker mode="md" [showDefaultButtons]="true" class="picker-opts" minuteValues="0,15,30,45" [id]="spinnerId + timeField.id" presentation="time" [value]="timeField.signal()" (ionChange)="setTime($event, timeField.signal)" [formatOptions]="{ time: { hour: '2-digit', minute: '2-digit' } }">
            <ion-grid slot="buttons" class="button-grid">
              <ion-row>
                <ion-col>
                  <ion-button expand="block" color="danger" (click)="timePicker.cancel(true)" translate>GENERAL.CANCEL</ion-button>
                </ion-col>

                <ion-col>
                  <ion-button expand="block" fill="solid" color="primary" (click)="timePicker.confirm(); timePicker.cancel(true)" translate>GENERAL.OK</ion-button>
                </ion-col>
              </ion-row>
            </ion-grid>
          </ion-datetime>
        </ng-template>
      </ion-modal>
    </ion-item>
  }
}
