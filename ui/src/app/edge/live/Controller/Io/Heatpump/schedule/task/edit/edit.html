<oe-components-scheduler-edit-task [(payload)]="payload" [(allowedPeriods)]="allowedPeriods">
  <ion-item content>
    <ion-select [label]="'GENERAL.MODE' | translate" [placeholder]="'HEAT.SCHEDULE.MODE_SELECTION_PLACEHOLDER' | translate" [value]="payload()?.value?.baseMode ?? null" (ionChange)="setValue($event)">
      @for (option of baseModeOptions; track option) {
        <ion-select-option [value]="option.value">
          {{ option.label }}
        </ion-select-option>
      }
    </ion-select>
  </ion-item>
</oe-components-scheduler-edit-task>
