@if (edge !== null) {
  <oe-navigation-view>
    <ion-buttons header class="ion-justify-content-center">
      <div #ref><ng-content select="[custom-pickdate]"></ng-content></div>
      @if (!ref.children.length) {
        <pickdate></pickdate>
      }
    </ion-buttons>
    <oe-controller-peakshaving-timeslot-chart (setChartConfig)="setChartConfig($event)" [isOnlyChart]="true" [component]="component"> </oe-controller-peakshaving-timeslot-chart>
  </oe-navigation-view>
}
