@if (edge() !== null) {
  <oe-navigation-view>
    <ng-container header #header>
      <ion-toolbar>
        <ion-title class="ion-no-padding">
          <ion-buttons class="ion-justify-content-center">
            <ion-button>
              <pickdate></pickdate>
            </ion-button>
          </ion-buttons>
        </ion-title>
      </ion-toolbar>
    </ng-container>
    <energychart [isOnlyChart]="true"></energychart>
  </oe-navigation-view>
}
