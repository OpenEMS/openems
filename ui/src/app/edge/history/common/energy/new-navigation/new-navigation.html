@if (edge() !== null) {
  <oe-navigation-view>
    <ng-container header #header>
      <ion-item lines="none">
        <ion-label class="ion-text-center"> {{ "GENERAL.HISTORY" | translate }} </ion-label>
      </ion-item>
    </ng-container>
    <ng-container header>
      <ion-toolbar style="--background: var(--ion-background-color)">
        <ion-buttons class="ion-justify-content-center">
          <pickdate [attr.data-tutorial-id]="tutorialTargetId.HISTORY_VIEW_DATE_PICKER"></pickdate>
        </ion-buttons>
      </ion-toolbar>
    </ng-container>
    <energychart [attr.data-tutorial-id]="tutorialTargetId.HISTORY_VIEW" [isOnlyChart]="true"></energychart>
  </oe-navigation-view>
}
