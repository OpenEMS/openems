@if (edge() !== null) {
  <oe-navigation-view>
    <ng-container header #header>
      <ion-item lines="none">
        <ion-label class="ion-text-center"> {{ "GENERAL.HISTORY" | translate }} </ion-label>
      </ion-item>
    </ng-container>
    <ng-container header>
      <ion-toolbar style="--background: var(--ion-background-color)">
        <ion-buttons class="ion-justify-content-center">
          <pickdate></pickdate>
        </ion-buttons>
      </ion-toolbar>
    </ng-container>
    <energychart [isOnlyChart]="true"></energychart>
  </oe-navigation-view>
}
