gatewayError = Gateway error (Cooling Unit to EDGE communication has failed)
systemError = System error
overTemperatureAlarm = Over temperature [E11]
underTemperatureAlarm = Under temperature [E10]
dryRun = Dry running protection [E03] (fill level too low)
overTemperatureWarning = Over temperature warning [U11] (Flow temperature deviates more than 3 K from setpoint)
underTemperatureWarning = Under temperature warning [U10] (Flow temperature deviates more than 3 K from setpoint)
waterLevelWarning = Tank fill level low [U01] (Heating not available)
fanError = Fan malfunction [E53]
motorProtectionSwitchPump = Motor protection switch pump [E02]
motorProtectionSwitchCompressor = [U42]: Motor protection compressor (and fan)
sensorError = Sensor error temperature [Errors E80 to E93]
targetUndefined = System Internal Error: The component is configured to AUTO, but does not receive a command from a higher-level component
inverterCompressorWarning = Inverter/Compressor error [U42] (Refrigeration circuit, heating and fan not available, but no cooling currently needed)
inverterCompressorFault = Inverter/Compressor error [E42] (Refrigeration circuit, heating and fan not available and flow temperature deviates more than 3 K from setpoint)
lowPressureWarning = Low pressure warning [U40] (Refrigeration circuit, heating and fan not available, but no cooling currently needed)
lowPressureFault = Low pressure fault [E40] (Refrigeration circuit, heating and fan not available and flow temperature deviates more than 3 K from setpoint)
highPressureWarning = High pressure warning [U40] (Refrigeration circuit, heating and fan not available, but no cooling currently needed)
highPressureFault = High pressure fault [E40] (Refrigeration circuit, heating and fan not available and flow temperature deviates more than 3 K from setpoint)
overTemperatureWarning30 = Over temperature warning [U11] (Flow temperature deviates more than 3 K from setpoint)
overTemperatureFault60 = Over temperature fault [E11] (Flow temperature deviates more than 3 K from setpoint)
underTemperatureWarning30 = Under temperature warning [U10] (Flow temperature deviates more than 3 K from setpoint)
manualModeActivated = Manual mode activated. The component is no longer controlled by a higher-level component. (It is recommended to switch the manual control back to "Auto" after completing the work).