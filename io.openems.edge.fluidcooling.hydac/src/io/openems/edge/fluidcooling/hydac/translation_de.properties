gatewayError = Gateway-Fehler (Die Kommunikation zwischen EDGE und Klimagerät ist unterbrochen)
systemError = Systemfehler
overTemperatureAlarm = Übertemperatur [E11]
underTemperatureAlarm = Untertemperatur [E10]
dryRun = Trockenlaufschutz [E03] (Tank-Niveau zu gering)
overTemperatureWarning = Übertemperaturwarnung [U11] (Vorlauftemperatur weicht um mehr als 3 K vom Sollwert ab)
underTemperatureWarning = Untertemperaturwarnung [U10] (Vorlauftemperatur weicht um mehr als 3 K vom Sollwert ab)
waterLevelWarning = Tank-Niveau gering [U01] (Heizung nicht verfügbar)
fanError = Störung Lüfter [E53]
motorProtectionSwitchPump = Motorschutzschalter Pumpe [E02]
motorProtectionSwitchCompressor = [U42]: Motorschutz Verdichter (und Lüfter)
sensorError = Sensorfehler Temperaturfühler [Sammelfehler E80 bis E93]
targetUndefined = Systeminterner Fehler: Die Komponente ist auf AUTO konfiguriert, erhält aber keinen Befehl einer übergeordneten Komponente
inverterCompressorWarning = Fehler Frequenzumrichter oder Kompressor [U42] (Kältekreis, Heizung und Lüfter nicht verfügbar, aber aktuell keine Kühlung benötigt)
inverterCompressorFault = Fehler Frequenzumrichter oder Kompressor [E42] (Kältekreis, Heizung und Lüfter nicht verfügbar und Vorlauftemperatur weicht um mehr als 3 K vom Sollwert ab)
lowPressureWarning = Niederdruckwarnung [U40] (Kältekreis, Heizung und Lüfter nicht verfügbar, aber aktuell keine Kühlung benötigt)
lowPressureFault = Niederdruckfehler [E40] (Kältekreis, Heizung und Lüfter nicht verfügbar und Vorlauftemperatur weicht um mehr als 3 K vom Sollwert ab)
highPressureWarning = Hochdruckwarnung [U40] (Kältekreis, Heizung und Lüfter nicht verfügbar, aber aktuell keine Kühlung benötigt)
highPressureFault = Hochdruckfehler [E40] (Kältekreis, Heizung und Lüfter nicht verfügbar und Vorlauftemperatur weicht um mehr als 3 K vom Sollwert ab)
overTemperatureWarning30 = Übertemperaturwarnung [U11] (Vorlauftemperatur weicht seit min. 30 Minuten um mehr als 3 K vom Sollwert ab)
overTemperatureFault60 = Übertemperaturfehler [E11] (Vorlauftemperatur weicht seit min. 60 Minuten um mehr als 3 K vom Sollwert ab)
underTemperatureWarning30 = Untertemperaturwarnung [U10] (Vorlauftemperatur weicht seit min. 30 Minuten um mehr als 3 K vom Sollwert ab)
manualModeActivated = Manuelle Steuerung aktiviert. Die Komponente wird nicht mehr von einer übergeordneten Komponente gesteuert. (Es empfiehlt sich, die manuelle Steuerung nach Abschluss der Arbeit wieder auf "Auto" zu stellen).