# po4a configuration for the translations of the documentation; generated by wiki2adoc.
# Run from the "doc" directory: po4a l10n/po4a.cfg
# Sources are the English pages; translations are kept in l10n/po/<page>.<lang>.po,
# translated pages are written to build/l10n/<lang>/ (not versioned).

[po4a_langs] de
[po4a_paths] l10n/po/$master.pot $lang:l10n/po/$master.$lang.po
[options] --master-charset UTF-8 --localized-charset UTF-8 --keep 0 --porefs file

