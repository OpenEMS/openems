name: Octopus GridBuy validation

on:
  push:
    branches:
      - feature/octopus-dynamic-gridbuy
  workflow_dispatch:

jobs:
  test-octopus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Octopus module
        run: ./gradlew :io.openems.edge.timeofusetariff.octopusdynamic:compileJava --stacktrace --console=plain
      - name: Run Octopus unit tests
        run: ./gradlew :io.openems.edge.timeofusetariff.octopusdynamic:test --stacktrace --console=plain
      - name: Validate Octopus code style
        run: ./gradlew :io.openems.edge.timeofusetariff.octopusdynamic:checkstyleMain :io.openems.edge.timeofusetariff.octopusdynamic:checkstyleTest --stacktrace --console=plain
      - name: Build all Edge bundles required by the application
        run: ./gradlew build -x test -x checkstyleMain -x checkstyleTest --console=plain
      - name: Build deployable Edge application
        run: ./gradlew :io.openems.edge.application:export --stacktrace --console=plain
      - name: Inspect exported application
        run: find io.openems.edge.application -type f -name '*.jar' -printf '%p %s bytes\n'
      - name: Upload Edge application artifact
        uses: actions/upload-artifact@v4
        with:
          name: openems-edge-octopus-gridbuy
          path: io.openems.edge.application/generated/distributions/executable/EdgeApp.jar
          if-no-files-found: error
          retention-days: 7
