unableToSend = Daten konnten nicht übermittelt werden. Bitte prüfen Sie die Internetverbindung und die Konfigurationseinstellungen Ihrer App.
noCoordinates = Die Koordinaten des Systemstandorts sind nicht verfügbar. Bitte legen Sie den Standort dieser Anlage fest.
noGridMeter = Es ist kein Netzzähler vorhanden oder der eingestellte Zähler ist nicht verfügbar.
noVoltage = Der Netzzähler liefert keine gültige Spannung.
locationBlocked = Der Standort ist für die Annahme von Messungen gesperrt.
requestRejected = Die Messung wurde abgelehnt, weil ein Wert ungültig ist.
thirdPartyUsageNotAccepted = Es werden keine Daten gesendet, weil die Nutzung durch Dritte nicht akzeptiert wurde.
