unableToSend = Data could not be transmitted. Please check your internet connection and the configuration settings of your app.
noCoordinates = The coordinates of the system location are not available. Please set the location of this system.
noGridMeter = There is no grid meter or the configured meter is not available.
noVoltage = The grid meter does not provide a valid voltage.
locationBlocked = The location is blocked from submitting measurements.
requestRejected = The measurement was rejected because a value is invalid.
thirdPartyUsageNotAccepted = No data is sent because third-party usage was not accepted.
